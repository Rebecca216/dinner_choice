<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晚餐吃什麼？炫彩隨機晚餐轉盤 Dinner Wheel</title>
  <meta name="description" content="不知道晚餐吃什麼？使用晚餐轉盤一鍵隨機生成在地台味、日韓料理、歐美西餐、火鍋燒肉與輕食夜市，輕鬆決定今晚美食！" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app" class="app-container">
    <!-- 背景動態光暈流光 -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <!-- 頁頭資訊 -->
    <header class="app-header">
      <div class="logo-badge">
        <span class="logo-icon">🎰</span>
        <span class="logo-text">DINNER SPINNER</span>
      </div>
      <h1 class="main-title">今晚吃什麼？<span class="highlight-text">晚餐隨機轉盤</span></h1>
      <p class="subtitle">選擇困難症救星！點選下方主題「一鍵隨機生成」或自訂您喜愛的美食選項</p>
    </header>

    <!-- 一鍵隨機生成選單控管區 -->
    <section class="generator-toolbar card-glass">
      <div class="toolbar-title">
        <span class="icon">✨</span>
        <span>一鍵隨機生成選單：</span>
      </div>
      <div id="presetContainer" class="preset-pills">
        <!-- JS 動態渲染主題按鈕 -->
      </div>
      <div class="generator-actions">
        <div class="count-selector">
          <label for="itemCountSelect">選項數量：</label>
          <select id="itemCountSelect" class="custom-select">
            <option value="6">6 個選項</option>
            <option value="8" selected>8 個選項</option>
            <option value="10">10 個選項</option>
            <option value="12">12 個選項</option>
          </select>
        </div>
        <button id="btnShuffle" class="btn btn-secondary">
          <span>🔀 重新洗牌</span>
        </button>
      </div>
    </section>

    <!-- 主要內容區 (雙欄佈局) -->
    <main class="main-content">
      <!-- 左欄：轉盤區 -->
      <section class="wheel-section card-glass">
        <div class="wheel-wrapper">
          <!-- 頂部轉盤指針 (12 點鐘方向) -->
          <div class="wheel-pointer" id="wheelPointer">
            <div class="pointer-arrow"></div>
          </div>

          <!-- Canvas 轉盤 -->
          <canvas id="wheelCanvas"></canvas>
        </div>

        <button id="btnSpin" class="btn btn-spin btn-glow">
          <span class="spin-icon">🎲</span>
          <span class="spin-text">開始抽晚餐！</span>
        </button>
      </section>

      <!-- 右欄：選項管理與歷史紀錄頁籤 -->
      <section class="control-section card-glass">
        <div class="tab-header">
          <button id="tabOptionsBtn" class="tab-btn active">
            <span class="icon">📝</span> 轉盤選項 (<span id="activeCountBadge">0</span>)
          </button>
          <button id="tabHistoryBtn" class="tab-btn">
            <span class="icon">🏆</span> 抽獎紀錄
          </button>
        </div>

        <!-- 頁籤 1：選項管理 -->
        <div id="tabOptions" class="tab-content active">
          <form id="addOptionForm" class="add-option-form">
            <div class="input-group">
              <input type="text" id="inputEmoji" class="custom-input emoji-input" placeholder="🍔" maxlength="2" />
              <input type="text" id="inputName" class="custom-input name-input" placeholder="輸入美食名稱 (例如: 牛肉麵)" required />
              <button type="submit" class="btn btn-primary btn-add">
                <span>➕ 新增</span>
              </button>
            </div>
          </form>

          <div class="options-batch-bar">
            <button id="btnSelectAll" class="btn-text">全選</button>
            <span class="divider">|</span>
            <button id="btnDeselectAll" class="btn-text">全取消</button>
            <span class="divider">|</span>
            <button id="btnClearAll" class="btn-text text-danger">清空選單</button>
          </div>

          <!-- 選項清單 -->
          <div id="optionsList" class="options-list">
            <!-- JS 動態生成選項卡片 -->
          </div>
        </div>

        <!-- 頁籤 2：抽獎歷程 -->
        <div id="tabHistory" class="tab-content">
          <div class="history-actions">
            <span class="history-count">共 <strong id="historyCountText">0</strong> 筆抽獎紀錄</span>
            <button id="btnClearHistory" class="btn-text text-danger">清空紀錄</button>
          </div>
          <div id="historyList" class="history-list">
            <!-- JS 動態生成歷史紀錄 -->
          </div>
        </div>
      </section>
    </main>

    <!-- 獲勝結果 Modal 彈窗 -->
    <div id="resultModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-sparkles">🎉✨🎊</div>
        <div class="modal-emoji" id="modalEmoji">🍱</div>
        <h3 class="modal-subtitle">命運的安排！今晚就吃：</h3>
        <h2 class="modal-title" id="modalWinnerName">台式便當</h2>
        <p class="modal-desc" id="modalWinnerDesc">排骨便當、雞腿便當或控肉便當</p>
        
        <div class="modal-meta" id="modalMeta">
          <span class="badge badge-calories">🔥 <span id="modalCalories">650 kcal</span></span>
        </div>

        <div class="modal-buttons">
          <a id="btnGoogleMaps" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-maps">
            <span>📍 Google Maps 搜尋附近店家</span>
          </a>
          <button id="btnSpinAgain" class="btn btn-secondary">
            <span>🔄 再轉一次</span>
          </button>
        </div>

        <button id="btnCloseModal" class="btn-close">&times;</button>
      </div>
    </div>

    <!-- 全螢幕 Confetti Canvas -->
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <footer class="app-footer">
      <p>💡 提示：您可以自由調整各項美食的權重 (數字越大機率越高)，或隨時點選頂部類別更換選單！</p>
    </footer>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
